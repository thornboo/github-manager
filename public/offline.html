<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离线 - GitHub Manager</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1a1a2e;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
      }
      .container {
        max-width: 420px;
      }
      .icon {
        font-size: 48px;
        margin-bottom: 16px;
        opacity: 0.9;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 10px;
      }
      p {
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 18px;
        line-height: 1.6;
      }
      button {
        background: #4f46e5;
        color: #fff;
        border: none;
        padding: 12px 22px;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">(offline)</div>
      <h1>您已离线</h1>
      <p>
        请检查网络连接后重试。如果您之前访问过此应用，可以尝试刷新以查看缓存数据。
      </p>
      <button onclick="location.reload()">重试</button>
    </div>
  </body>
</html>
